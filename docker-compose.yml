version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: cetti-postgres
    restart: always
    environment:
      POSTGRES_DB: cetti
      POSTGRES_USER: cetti
      POSTGRES_PASSWORD: cetti123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    container_name: cetti-redis
    restart: always
    ports:
      - "6379:6379"

  n8n:
    image: n8nio/n8n:latest
    container_name: cetti-n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=cetti
      - DB_POSTGRESDB_USER=cetti
      - DB_POSTGRESDB_PASSWORD=cetti123
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=admin123
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - GENERIC_TIMEZONE=America/Sao_Paulo
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - postgres
      - redis

  # Chatwoot - subir somente quando fechar cliente que precise
  # para subir o chatwoot, use o comando:
  # docker-compose --profile advanced up -d chatwoot
  chatwoot:
    image: chatwoot/chatwoot:latest
    container_name: cetti-chatwoot
    restart: always
    env_file:
      - chatwoot.env
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis
    profiles:
      - advanced

volumes:
  postgres_data:
  n8n_data:
